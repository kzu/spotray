[package]
name = "spotray"
version = "0.1.0"
description = "A tray-resident Spotify Connect device for this machine"
authors = ["you"]
edition = "2021"

[lib]
name = "spotray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
hostname = "0.4"
